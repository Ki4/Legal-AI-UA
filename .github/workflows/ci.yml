name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Docs
        run: pnpm docs:check

      # Static, so it belongs here rather than in the SQL workflow: it needs no
      # database, and a migration missing from the ledger repair script should
      # go red on every pull request, not only on the ones that touch supabase/.
      - name: SQL conventions
        run: pnpm check:sql

      # The mechanical half of DoD §6 (docs/specs/console-feature-dod.md): a
      # hardcoded string or a raw Tailwind colour looks fine to whoever wrote
      # it and to every other gate here — lint doesn't know a class name from
      # a colour, typecheck doesn't know a string is copy. This is what looks.
      - name: Copy conventions
        run: pnpm check:copy

      # The other half of DoD §6, and the half that had no instrument until
      # 2026-08-27: whether the tokens a screen used are legible against each
      # other. jsdom applies no stylesheet, so a component test proves a token
      # was used and never that the result can be read — which is how the primary
      # button spent weeks at 2.5:1 in the dark theme with every gate green.
      - name: Contrast
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

  # A separate job, and parallel to `verify` on purpose. `pnpm probes` breaks
  # real source files one at a time and runs the one test that must notice, so
  # it costs minutes rather than seconds — appended to `verify` it would push
  # every pull request's wall-clock out by that much, and run last, after the
  # cheap checks a change usually fails on. Beside it, it costs nothing a human
  # waits for.
  #
  # Why not a nightly run, which is the other obvious shape: a nightly failure
  # arrives detached from the change that caused it, hours later, against a main
  # that has moved. The point of this suite is that the tests can fail, and that
  # claim is only useful attached to the commit that weakened one. Why not a
  # path filter: the set of files a probe reaches is the set of files it patches
  # plus every test that watches them, and `probes.mjs` itself — a filter that
  # forgets the last one is a filter that stops running exactly when a probe is
  # edited.
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner refuses to start on a dirty tree, because it restores by
      # rewriting originals and `git checkout .` is the recovery if it dies.
      # A fresh checkout is clean; this fails loudly if some earlier step ever
      # stops leaving it that way.
      - name: Probes
        run: pnpm probes
