name: Keep alive

# The cloud project is on the free tier, which pauses a project after a week
# without activity. Nothing in this repository talks to the cloud on a schedule
# yet (the law sweep is not deployed), so the project paused unnoticed — found
# INACTIVE on 2026-10-10, three weeks after the last session.
#
# Every three days, well inside the week: one real query against the database,
# through the Management API with the token CI already holds, so no database
# password or API key is added. If the project is found paused anyway, the job
# asks for a restore and fails — a restore is news, not a green tick.
#
# It also runs on the pull request that changes it, so the credential and the
# endpoints are proved before the schedule depends on them. GitHub disables
# scheduled workflows after 60 days without a commit; that is the one way this
# can quietly stop.
on:
  schedule:
    - cron: "17 6 */3 * *"
  pull_request:
    paths:
      - ".github/workflows/keep-alive.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      API: https://api.supabase.com/v1

    steps:
      - name: Project status
        id: status
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          test -n "$REF" || { echo "::error::vars.SUPABASE_PROJECT_REF is not set"; exit 1; }
          code=$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$REF")
          # Only the API's `message`, on one line and capped: the log is public
          # and a raw body could carry a newline that opens a workflow command.
          reason=$(jq -r '.message // "no message"' body.json 2>/dev/null | tr -d '[:cntrl:]' | head -c 300)
          case "$code" in
            200) ;;
            401) echo "::error::401: SUPABASE_ACCESS_TOKEN is expired or revoked. Mint a new one and 'gh secret set SUPABASE_ACCESS_TOKEN'."; exit 1 ;;
            403) echo "::error::403: the token is valid but may not read project $REF: $reason"; exit 1 ;;
            *) echo "::error::HTTP $code from the Management API: $reason"; exit 1 ;;
          esac
          status=$(jq -r .status body.json)
          echo "Project $REF is $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Restore a paused project
        if: steps.status.outputs.status == 'INACTIVE'
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$REF/restore"
          echo "::error::Project $REF was paused; a restore was requested. It takes a few minutes."
          exit 1

      - name: Query the database
        if: steps.status.outputs.status == 'ACTIVE_HEALTHY'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"select now() as alive"}' \
            "$API/projects/$REF/database/query"

      - name: Any other status is a failure
        if: steps.status.outputs.status != 'INACTIVE' && steps.status.outputs.status != 'ACTIVE_HEALTHY'
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: |
          echo "::error::Project $REF is $STATUS; neither queried nor restored."
          exit 1
