name: SQL

# A separate workflow rather than a job in CI, because it needs a database and
# most pull requests do not touch one. Paths keep it off the frontend's back;
# `push: main` keeps it honest about what actually landed.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/*sql*"
      - ".github/workflows/sql.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*sql*"
      - ".github/workflows/sql.yml"

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local stack
        run: pnpm exec supabase start

      # Not redundant after `start`. This is the only thing in the repository
      # that proves the migrations apply to an *empty* database — which is what
      # every fresh environment is, and what no incremental apply ever tests.
      # A migration written against the schema that already exists locally can
      # pass by hand for weeks and fail the first time it meets a new project.
      - name: Rebuild from migrations and seed
        run: pnpm exec supabase db reset

      # `shared/vocabulary.ts` (and every hand-written row type derived from
      # `Database`) is only as honest as the last regeneration. A migration
      # that adds an enum value or a column breaks nothing by itself — it
      # breaks the moment somebody forgets to run `pnpm db:types`, which is a
      # moment CI cannot wait for. The database is freshly rebuilt from this
      # PR's migrations above, so regenerating now and diffing catches a
      # stale `database.types.ts` on the PR that made it stale, not on
      # whichever one regenerates next.
      #
      # Prettier runs before the diff, and is not optional. `supabase gen types`
      # emits unformatted output; the committed file went through `lint-staged`
      # on its way in, so comparing the generator's raw output against it is 378
      # lines of moved semicolons every time, whatever the schema says. The
      # first run of this step failed exactly that way. Normalising both sides
      # the way a commit would is what makes the diff mean "the schema moved".
      - name: Check generated types are current
        run: |
          pnpm db:types
          pnpm exec prettier --write packages/db/src/database.types.ts
          if ! git diff --exit-code packages/db/src/database.types.ts; then
            echo "::error::packages/db/src/database.types.ts is out of date with the schema in this PR. Run 'pnpm db:types' locally and commit the result."
            exit 1
          fi

      - name: Verification scenarios
        run: pnpm verify:sql
